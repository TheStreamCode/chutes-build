name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub-hosted Linux/Windows runners have 4 vCPUs; this was needlessly
  # capped at 2, roughly doubling compile time on a cold cache. A cold
  # cache (evicted after today's several Cargo.lock-changing version
  # bumps) combined with the 60-minute job timeout let a full rebuild get
  # cancelled mid-compile, before any test ever ran.
  CARGO_BUILD_JOBS: 4
  CARGO_TERM_COLOR: always
  # CI runners have no recognized terminal brand (no WT_SESSION/TERM_PROGRAM
  # etc.), so `is_legacy_windows_console()` default-denies to legacy/ASCII
  # glyphs on the Windows runner -- unlike a real dev machine's terminal.
  # Force the modern-glyph path so Windows tests exercise the same rendering
  # as local development. No-op on non-Windows hosts.
  CHUTES_BUILD_FORCE_LEGACY_CONSOLE: "0"

jobs:
  security:
    name: Secrets and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
          ./gitleaks version
      - name: Scan Git history for secrets
        run: ./gitleaks git . --no-banner --no-color --redact
      - name: Check dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked
          command-arguments: advisories licenses bans sources

  rust-quality:
    name: Rust quality (Linux)
    runs-on: ubuntu-24.04
    # 90, matching the Windows job. This was 60, which fitted while the job died
    # early: for twenty runs it stopped at the formatting check or the pager tests,
    # so the four steps below — auth and session integration, agent construction,
    # the Chutes tools, clippy — never ran. The first run that reached the end took
    # 59.7 minutes of work and was killed during the cache *save*, which then left
    # the next run cold, slower, and killed in the same place.
    #
    # Measured twice since: 65 minutes, then 67. The cost is not compilation — it is
    # ~45 minutes of tests plus ~11 of clippy — so a warm cache moves it very little
    # and the headroom here is real but modest, around a quarter. Anything that adds
    # a slow test suite to this job should re-measure rather than assume the margin.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check Chutes Build
        run: cargo check -p chutes-build --locked
      - name: Test Chutes Build core
        run: cargo test -p chutes-build-core --locked
      - name: Test CLI parser and pager behavior
        run: |
          cargo test -p chutes-build --locked
          cargo test -p xai-grok-pager --lib --locked
          cargo test -p xai-grok-pager --test settings_e2e --locked
      - name: Test authentication and session integration
        # The auth-provider fixtures run a real helper rather than a shell
        # one-liner, because a provider command goes through `cmd /C` off Unix
        # and the POSIX forms meant nothing there. `--lib` does not build a
        # crate's binaries, so it is built explicitly first.
        run: |
          cargo build -p xai-grok-shell --bin auth-provider-fixture --locked
          cargo test -p xai-grok-shell --lib auth:: --locked
      - name: Test agent construction and bundled skills
        run: |
          cargo test -p xai-grok-agent --lib --locked
          cargo test -p xai-grok-shell --lib builtin:: --locked
      - name: Test Chutes-native tools
        run: "cargo test -p xai-grok-tools --lib implementations::chutes:: --locked"
      - name: Clippy (Chutes-owned packages)
        run: |
          cargo clippy -p chutes-build -p chutes-build-core -p xai-grok-tools \
            --all-targets --locked --no-deps -- -D warnings
          cargo clippy -p xai-grok-pager --lib --locked --no-deps -- -D warnings
      # No Linux baseline is committed yet: the 122 known failures were measured
      # on Windows and nobody has measured this platform. Until one exists the
      # script prints what it observed and exits 0, so this run is how the
      # numbers get discovered — read the log and commit
      # `.github/known-failures/linux.txt` if the list is stable.
      - name: Known-failure baseline
        run: python3 scripts/known_failures.py --crate xai-grok-tools --crate xai-grok-workspace

  npm-package:
    name: npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test launcher
        run: npm test
      - name: Verify release versions
        run: npm run verify:release
      - name: Inspect package contents
        run: npm pack --dry-run

  windows-check:
    name: Rust quality (Windows)
    runs-on: windows-2025
    # 150, because the known-failure gate below added real work to a budget
    # sized without it. Measured on the run that hit the wall: checkout 12s,
    # `Check Chutes Build` 10m, pager 23m, auth+tools 26m — 59 minutes — and
    # the gate had used 31 more and was not finished when 90 struck. It has to
    # compile `xai-grok-workspace`, which nothing else in this job builds; the
    # suites themselves run in under a minute.
    #
    # Every step that existed before succeeded. This is the same shape as the
    # 120-minute release budget that shipped nothing: a job that did all its
    # work and got killed on the last step. Sizing it at 59 + ~40 cold + margin.
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Check Chutes Build
        run: cargo check -p chutes-build --locked
      - name: Test CLI and pager on Windows
        run: |
          cargo test -p chutes-build --locked
          cargo test -p xai-grok-pager --lib --locked
      - name: Test authentication and tools on Windows
        # The auth-provider fixtures run a real helper rather than a shell
        # one-liner, because a provider command goes through `cmd /C` off Unix
        # and the POSIX forms meant nothing there. `--lib` does not build a
        # crate's binaries, so it is built explicitly first.
        run: |
          cargo build -p xai-grok-shell --bin auth-provider-fixture --locked
          cargo test -p xai-grok-shell --lib auth:: --locked
          cargo test -p xai-grok-tools --lib implementations::chutes:: --locked
      # The two crates with pre-existing Windows failures, gated against a
      # committed baseline rather than skipped. The steps above run narrow
      # filters, which left 122 tests neither passing nor watched — a new
      # failure among them was indistinguishable from the other 122.
      - name: Known-failure baseline
        run: python scripts/known_failures.py --crate xai-grok-tools --crate xai-grok-workspace

  macos-check:
    name: Rust check (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Check Chutes Build
        run: cargo check -p chutes-build --locked
      - name: Test pager on macOS
        run: cargo test -p xai-grok-pager --lib --locked
