[package]
license = "Apache-2.0"
name = "chutes-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the chutes-build CLI, extracted from chutes-shell for dependency inversion."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
chutes-config = { workspace = true }
chutes-sandbox = { path = "../chutes-sandbox", default-features = false }

[features]
default-bazel = []

[lints]
workspace = true
