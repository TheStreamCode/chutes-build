[package]
name = "chutes-build"
version = "2.0.1"
edition.workspace = true
license = "Apache-2.0"
authors = ["Michael Gasperini (Mikesoft)"]
default-run = "chutes-build"
description = "Privacy-first coding agent optimized for the Chutes ecosystem"

# Composition-root binary for the Chutes Build TUI. This package exists so the binary can link both the pager
# library and the optional `chutes-pager-minimal` render mode: `minimal`
# depends on `chutes-pager`, so the pager library cannot depend back on it
# (cargo cycle). The binary installs the minimal-mode IoC hooks at startup.
[[bin]]
name = "chutes-build"
path = "src/main.rs"

[dependencies]
# The compile-time product kill switches. This binary owns the decision to check
# for updates at all, so it is where `AUTOMATIC_SELF_UPDATE` has to be read.
chutes-build-core = { path = "../../chutes-build-core" }
# The pager library (all application logic + the public API main.rs drives).
chutes-pager = { path = "../chutes-pager", default-features = false }
# Optional scrollback-native render mode, wired in via the fn-pointer seam.
chutes-pager-minimal = { path = "../chutes-pager-minimal", default-features = false }

# Agent runtime + leader/stdio/headless entry points.
chutes-cloud-config = { workspace = true }
chutes-login = { workspace = true }
chutes-shell = { path = "../chutes-shell", default-features = false }
chutes-update = { path = "../chutes-update", default-features = false }
chutes-version = { workspace = true }
chutes-telemetry = { workspace = true }
chutes-workspace = { workspace = true }
chutes-crash-handler = { path = "../chutes-crash-handler" }
chutes-acp-lib = { workspace = true }

# Async runtime + misc.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
semver = { workspace = true }
chutes-tty-utils = { workspace = true }
chutes-config = { workspace = true }
chutes-sandbox = { path = "../chutes-sandbox", default-features = false }
chutes-extra-ca = { workspace = true }

# Binary hardening: compile-time string + control-flow obfuscation.
obfstr = { workspace = true }
cryptify = { workspace = true }

# Single-binary builds: the embedded runtime, its unpacker, and the site setup command.
clap = { workspace = true, features = ["derive"], optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
chutes-dirs = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[build-dependencies]
sha2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
tikv-jemallocator = { workspace = true, optional = true, features = ["stats"] }
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = { workspace = true, optional = true }
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = { workspace = true, optional = true, features = ["stats", "use_std"] }

[dev-dependencies]
serial_test = { workspace = true }
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = { workspace = true, features = ["derive"] }

[features]
default = [
    "stock",
    "jemalloc",
    "sandbox-enforce",
    ]
default-bazel = [
    "stock",
    "jemalloc",
    "sandbox-enforce",
    "local-workspace",
    ]
# The defaults of the crates this binary builds on. `default` and `release-dist` turn them on; a
# `--no-default-features` build that wants them names this feature.
stock = [
    "chutes-pager/default",
    "chutes-pager-minimal/default",
    "chutes-shell/default",
    "chutes-update/default",
]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
# chutes-workspace no longer enables sandbox-enforce by default, so enable it here.
sandbox-enforce = ["chutes-pager/sandbox-enforce", "chutes-workspace/sandbox-enforce"]
local-workspace = ["chutes-pager/local-workspace"]
# Test-only, prod-inert seam: lets the e2e harness install a TEST-signed managed-policy key the
# spawned pager trusts. Double locked out of production: absent from `default`, `default-bazel`, and
# `release-dist`, and the install hook is additionally gated on `debug_assertions` (off in shipped
# `-c opt`/release builds). Never add this to a shipped feature set.
test-seams = []
release-dist = [
    "stock",
    "chutes-pager/release-dist",
    ]
