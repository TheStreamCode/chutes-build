[package]
license = "Apache-2.0"
name = "chutes-shell"
version = "2.0.1"
edition.workspace = true

[features]
default = []
dhat-heap = ["dep:dhat"]
# Session synthesis + in-process e2e harness (`session::testkit`) for soak,
# load, and bench tests. Off by default; the tests/benches that use it declare
# it via `required-features`. Forwards login, sampler, and workspace
# `test-support` so downstream test builds see those crates' test seams
# (`isolated_spawn_e2e` uses `WorkspaceOps::for_test`).
test-support = [
    "chutes-cloud-config/test-support",
    "chutes-login/test-support",
    "chutes-sampler/test-support",
    "chutes-workspace/test-support",
]
test-util = []
# Local Computer Hub workspace_server (own/attach + crash-restart). Requires
local-workspace = []
# CI default set (preferred over cargo `default` for hermetic CI builds):
# `config-docs` is on this set (not cargo `default`) so hermetic lib tests
# parse the committed config-reference page.
config-docs = []
default-bazel = [
    "local-workspace",
    "test-support",
    "config-docs",
]

[dependencies]
dunce = { workspace = true }
# Fork: live model-capability checks (vision delegation trigger).
chutes-build-core = { path = "../../chutes-build-core" }
# Kept for the fork's sampling-test fixture bin (`src/bin/test-sampling-server.rs`);
# upstream 1.0.45 no longer depends on it here.
tokio-stream = { workspace = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
chutes-announcements = { workspace = true }
chutes-prompt-queue = { workspace = true }
chutes-version = { workspace = true }

async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
# rmcp 2.1 + reqwest 0.13 are quarantined inside `chutes-mcp`. The remaining
# MCP code in this crate (extensions/mcp.rs, mcp_doctor.rs) reaches rmcp model
# types via `chutes_mcp::rmcp::model::*`. reqwest 0.13 is a private impl
# detail of chutes-mcp::servers; shell never sees it. Every HTTP call site
# in this crate uses workspace reqwest 0.12.
chutes-mcp = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
reqwest-middleware = { workspace = true }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
clap = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
obfstr = { workspace = true }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tokio-retry = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
chutes-acp-lib = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
webbrowser = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
gcloud-storage = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = "0.15"
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
dhat = { workspace = true, optional = true }
base64 = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
chutes-fast-worktree = { path = "../chutes-fast-worktree", features = ["metadata"] }

chutes-paths = { path = "../chutes-paths" }
chutes-shell-base = { workspace = true }
chutes-shell-session-support = { workspace = true }
chutes-shell-terminal = { workspace = true }
chutes-shared = { workspace = true }
chutes-status-line = { workspace = true }
chutes-tracing-macros = { path = "../chutes-tracing-macros" }
chutes-fsnotify = { path = "../chutes-fsnotify" }
chutes-codebase-graph = { path = "../chutes-codebase-graph" }
chutes-hunk-tracker = { path = "../chutes-hunk-tracker" }
chutes-agent-lifecycle = { workspace = true }
chutes-interjection-core = { workspace = true }
chutes-message-delivery-core = { workspace = true }
chutes-sandbox = { path = "../chutes-sandbox", default-features = false }
chutes-chat-state = { path = "../chutes-chat-state" }
# Segment markdown rendering + the `compaction/` store path convention.
chutes-compaction-transcript = { workspace = true }
chutes-compaction = { path = "../../common/chutes-compaction" }
chutes-extra-ca = { workspace = true }
# Leader lock: bounded flock polling behind the machine-local acquire slot.
chutes-file-lock = { workspace = true }
chutes-sampler = { path = "../chutes-sampler" }
# Session FTS search; owns this crate's only rusqlite/bundled-SQLite use.
chutes-session-search = { workspace = true }
chutes-token-estimation = { workspace = true }
chutes-sampling-types = { path = "../chutes-sampling-types" }
chutes-tools = { path = "../chutes-tools" }
chutes-tty-utils = { workspace = true }
chutes-workflow = { path = "../chutes-workflow" }
chutes-workspace = { workspace = true }
# Backs the compatibility-only `chutes_shell::foreign_sessions` re-export.
chutes-foreign-sessions = { workspace = true }
chutes-subagent-resolution = { path = "../chutes-subagent-resolution" }
chutes-agent = { path = "../chutes-agent" }
chutes-bundle = { workspace = true }
chutes-cloud-config = { workspace = true }
chutes-config = { workspace = true }
chutes-external-agent-migration = { workspace = true }
chutes-feedback = { workspace = true }
chutes-config-types = { workspace = true }
chutes-env = { workspace = true }
chutes-dirs = { workspace = true }
chutes-memory = { workspace = true }
chutes-hooks = { path = "../chutes-hooks" }
chutes-hooks-plugins-types = { path = "../chutes-hooks-plugins-types" }
chutes-plugin-marketplace = { path = "../chutes-plugin-marketplace" }
chutes-file-utils = { path = "../chutes-file-utils" }
chutes-otel = { workspace = true }
chutes-session-events = { workspace = true }
chutes-auth = { workspace = true, features = ["middleware"] }
chutes-telemetry = { workspace = true }
chutes-http = { workspace = true }
chutes-login = { workspace = true }
chutes-models = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
flate2 = { workspace = true }
fs2 = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
parking_lot.workspace = true
dashmap.workspace = true

# Used by acp_session.rs and mcp_servers.rs for the unified
# chutes_tool_runtime::Tool dispatch model and the computer-hub MCP adapter.
chutes-computer-hub-sdk = { workspace = true }
chutes-tool-runtime = { workspace = true }
chutes-tool-protocol = { workspace = true }
chutes-tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
siphasher = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
chutes-dirs = { workspace = true }
chutes-status-line = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
# Pre-main unified-log redirect (`test_support::redirect_unified_log_for_tests`).
ctor = { workspace = true }
filetime = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
# `extensions::bundle` tests build archives with `bundle::test_helpers`, which
# is `#[cfg(test)]`-only inside chutes-bundle without this feature.
chutes-bundle = { workspace = true, features = ["test-support"] }
chutes-memory = { workspace = true, features = ["test-support"] }
# sandbox-enforce: keep tests running against the enforcing sandbox build.
chutes-workspace = { workspace = true, features = ["test-support", "sandbox-enforce"] }
chutes-config = { workspace = true, features = [] }
# Shell tests call the test-only functions in `chutes_cloud_config::settings_get`.
chutes-cloud-config = { workspace = true, features = ["test-support"] }
tar = { workspace = true }
flate2 = { workspace = true }
semver = { workspace = true }
serial_test = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
chutes-shell-base = { workspace = true, features = ["test-support"] }
# Exposes the login crate's `#[cfg(test)]`-only auth-provider helpers
# (`test_counting_provider`, `test_backdate_provider_mint`) to shell tests.
chutes-login = { workspace = true, features = ["test-support"] }
# Exposes sampler's `notify_on_submit` mock to lib tests via feature unification.
chutes-sampler = { path = "../chutes-sampler", features = ["test-support"] }
chutes-test-support = { workspace = true, features = [] }
chutes-test-utils = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[dependencies.tempfile]
workspace = true

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "fork_copy"
harness = false
required-features = ["test-support"]

[[bench]]
name = "skills_watcher_startup"
harness = false

[[bench]]
name = "child_replay_lookup"
harness = false

# Ordinary integration tests live in `tests/all.rs` (`mod suite`) so cargo
# links one binary. The test name is `chutes-shell-all` (Bazel `//pkg:all`
# is the package wildcard). Process-isolated suites stay as implicit
# `tests/*.rs` binaries.
[[test]]
name = "test_startup_prefetch_fallback"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_overlap"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_policy"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_repair_overlap"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_repair_skip"
required-features = ["test-support"]

[[test]]
name = "mcp_toggle_gateway_persist"
required-features = ["test-support"]

[[test]]
name = "plugins_action_policy_gate"
required-features = ["test-support"]

[[test]]
name = "session_create_hook_deferral"
required-features = ["test-support"]

[[test]]
name = "plugins_action_uninstall_data"
required-features = ["test-support"]

[[test]]
name = "session_create_subphase_timers"
required-features = ["test-support"]

[[test]]
name = "sessions_active_gauge"
required-features = ["test-support"]
[[test]]
name = "spawn_actor_timers"
required-features = ["test-support"]

[[test]]
name = "subagent_bootstrap_regression"
required-features = ["test-support"]

[[test]]
name = "test_image_strip_recovery"
required-features = ["test-support"]

[[test]]
name = "test_startup_boot_current_thread"
required-features = ["test-support"]

[[test]]
name = "test_startup_settings_unpersisted_session"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_shared"
required-features = ["test-support"]

[[test]]
name = "tool_call_trace"
required-features = ["test-support"]

[[test]]
name = "tool_call_trace_off"
required-features = ["test-support"]

[lints]
workspace = true
[build-dependencies]
# build.rs only downloads ripgrep — no rmcp involvement. Workspace reqwest
# (0.12) is plenty.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }

[[bin]]
name = "chat-history-downgrade"
path = "src/bin/chat-history-downgrade.rs"
