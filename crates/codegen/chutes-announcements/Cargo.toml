[package]
license = "Apache-2.0"
edition.workspace = true
name = "chutes-announcements"
version = "0.1.0"
description = "Shared announcement types, persistence, and formatting for Chutes Build CLI apps"

[features]
# TS bindings generation only (external desktop clients consume the committed output);
# off by default so Bazel/CI builds never compile ts-rs. See generate.sh.
ts = ["dep:ts-rs", "chutes-config/ts"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }
chutes-config = { workspace = true }
chutes-tools = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
