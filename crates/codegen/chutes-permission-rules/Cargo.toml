[package]
license = "Apache-2.0"
name = "chutes-permission-rules"
version = "0.1.0"
edition.workspace = true
description = "Chutes Build's permission rule engine, apart from the session and tool code that uses it"

[dependencies]
agent-client-protocol = { workspace = true }
dunce = { workspace = true }
fs2 = { workspace = true }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
glob = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
tracing = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = "0.25"
url = { workspace = true }
chutes-dirs = { workspace = true }
chutes-config = { workspace = true }
chutes-paths = { path = "../chutes-paths" }
chutes-version = { workspace = true }
chutes-sqlite-journal = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
