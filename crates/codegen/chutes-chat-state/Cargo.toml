[package]
license = "Apache-2.0"
name = "chutes-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for Chutes Build agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `CompactionDetail`, embedded in `CompactionMode::Segments`.
chutes-compaction-transcript = { workspace = true }
chutes-compaction = { path = "../../common/chutes-compaction" }
chutes-sampling-types = { path = "../chutes-sampling-types" }
chutes-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
