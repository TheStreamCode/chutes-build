[package]
name = "chutes-pager"
version = "2.0.3"
edition.workspace = true
license = "Apache-2.0"
authors = ["Chutes Build contributors"]

[dependencies]
chutes-build-core = { path = "../../chutes-build-core" }
# TTY safety — detach subprocesses from the controlling terminal
dunce = { workspace = true }
chutes-tty-utils = { workspace = true }
chutes-version = { workspace = true }

# Shared prompt-queue wire types
chutes-prompt-queue = { workspace = true }

# Presentation-primitives layer (extracted)
chutes-pager-render = { path = "../chutes-pager-render" }

# The /gboom easter-egg game (extracted)
chutes-gboom = { path = "../chutes-gboom" }

# Diff hunk construction (extracted)
chutes-pager-diff = { path = "../chutes-pager-diff" }

# Rendering
ratatui = { workspace = true, features = ["crossterm", "unstable-widget-ref"] }
chutes-announcements = { workspace = true }
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
textwrap = { workspace = true }
regex = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
strip-ansi-escapes = { workspace = true }

# Markdown / syntax highlighting
chutes-markdown = { workspace = true }
# Inline Mermaid rendering engine. Always compiled (no feature gate): the
# dagre-based vendored engine renders detected ```mermaid fences out of process,
# gated only at runtime by the `appearance.render_mermaid` setting.
chutes-mermaid = { workspace = true }
syntect = { workspace = true }

# Data
similar = { workspace = true }
indexmap = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }

# ANSI parsing (tracing pane)
ansi-to-tui = { workspace = true }

# PTY for ssh wrapper, e2e tests, and benchmarking.
portable-pty = "0.9"

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
shlex = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-stream = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["compat"] }
tempfile = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Binary hardening: compile-time string obfuscation.
# (cryptify / rustls / semver / tikv-jemallocator moved to the composition-root
# binary `chutes-build` with `main.rs`; this lib no longer references them.)
obfstr = { workspace = true }

# Fuzzy matching (history search daemon)
nucleo = { workspace = true }

# Prompt text input
chutes-ratatui-textarea = { workspace = true }
chutes-ratatui-inline = { workspace = true }

# Update
chutes-update = { path = "../chutes-update", default-features = false }

# ACP
agent-client-protocol = { workspace = true }
chutes-acp-lib = { workspace = true }
chutes-chat-state = { path = "../chutes-chat-state", optional = true }
chutes-file-utils = { path = "../chutes-file-utils" }
# Crash-recovery registry of open TUI sessions.
chutes-active-sessions = { workspace = true }
chutes-config = { workspace = true }
chutes-external-agent-migration = { workspace = true }
chutes-feedback = { workspace = true }
chutes-sampling-types = { path = "../chutes-sampling-types", optional = true }
chutes-tool-types = { workspace = true }
chutes-dirs = { workspace = true }
chutes-dashboard-store = { workspace = true }
# Voice dictation. `audio` (mic capture) is enabled on every target. On
# macOS/Windows it links cpal; on Linux it compiles a subprocess-recorder
# backend instead, so cpal -> alsa-sys never reaches the static musl binary
# (cpal is target-gated to non-Linux inside chutes-voice).
chutes-voice = { path = "../chutes-voice", default-features = false, features = ["audio"] }
chutes-login = { workspace = true }
chutes-cloud-config = { workspace = true }
chutes-shell = { path = "../chutes-shell", default-features = false }
# The status-line contract: the config the user writes and the payload the
# agent sends. A leaf crate rather than the agent's, so the client reads it
# from upstream of the crate that fills it in.
chutes-status-line = { workspace = true }
chutes-workspace = { workspace = true }
# Foreign coding-agent session discovery.
chutes-foreign-sessions = { workspace = true }
chutes-token-estimation = { workspace = true }
chutes-telemetry = { workspace = true }
chutes-otel = { workspace = true }
chutes-fast-worktree = { path = "../chutes-fast-worktree", features = ["metadata"] }
gethostname = { workspace = true, optional = true }
backon = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
chutes-tools = { workspace = true }
chutes-agent = { workspace = true }
chutes-plugin-marketplace = { path = "../chutes-plugin-marketplace" }
# Blocked-card copy: `hook_display_name` lives next to the hook-name grammar.
chutes-hooks = { path = "../chutes-hooks" }
chutes-hooks-plugins-types = { path = "../chutes-hooks-plugins-types" }
walkdir = { workspace = true }
chutes-sandbox = { path = "../chutes-sandbox", default-features = false }

# Base64 encoding for image data
base64 = { workspace = true }

# Image decoding/resizing for clipboard image validation before send
image = { workspace = true, features = ["png", "jpeg", "tiff", "gif", "webp"] }

# ID generation
uuid = { workspace = true, features = ["v4", "v7"] }

# Path computation (plan file, etc.)
shellexpand = "3.1"

# libgit2 for the startup git-info populator (no fork/exec, runs once on launch
# in spawn_blocking; the render path never touches git directly).
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
urlencoding = { workspace = true }

# Parsing (web_search)
url = { workspace = true }

# Crash diagnostics
chutes-crash-handler = { path = "../chutes-crash-handler" }

# Non-poisoning mutex for signal handler (active-sessions crash recovery).
parking_lot.workspace = true

# nix: signal handling in notifications/.
# signal-hook: SIGWINCH handler for the `chutes-build wrap` PTY wrapper (pty_wrap.rs).
# libc: poll/read for non-blocking terminal reads in theme/osc11.rs.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }
signal-hook = { workspace = true }
libc = { workspace = true }

# core-foundation: IOKit power assertions for sleep prevention (SleepInhibitor).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

# SetConsoleCtrlHandler for the exec-emulating screen-mode relaunch
# (`/minimal` / `/fullscreen`): the waiting parent must ignore console Ctrl
# events so only the relaunched child handles them. Version matches the other
# in-repo consumers (chutes-crash-handler, chutes-system-power).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
chutes-interjection-core = { workspace = true }
# The fixture that builds a `[ui.status_line]` section field by field.
chutes-status-line = { workspace = true, features = ["test-support"] }
chutes-pager-render = { path = "../chutes-pager-render", features = ["test-support"] }
chutes-ratatui-inline = { workspace = true, features = ["test-support"] }
chutes-gboom = { path = "../chutes-gboom", features = ["test-support"] }
chutes-login = { workspace = true, features = ["test-support"] }
chutes-shell = { path = "../chutes-shell", default-features = false, features = ["test-support"] }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
wiremock = { workspace = true }
# Decodes the clip-transcription request the voice tests capture off wiremock.
prost = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
chutes-agent = { workspace = true }
# In-process leader-cluster harness (mock inference server; no cycle:
# chutes-test-support depends on neither the pager nor the shell).
chutes-test-support = { workspace = true, features = [] }
# Provider install for the in-process leader-cluster tests.
chutes-extra-ca = { workspace = true }

[[bench]]
name = "render"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "edit_highlight"
harness = false

[[bench]]
name = "resize"
harness = false

# Settings modal regression tests — keyboard/mouse dispatch + registry
# contracts. Not gated by `--ignored`; runs on every `cargo test`.
# Spawn-only pager tests live in `chutes-pager-pty-harness`.
[[test]]
name = "settings_e2e"
path = "tests/settings_e2e.rs"

# Opt into [workspace.lints.clippy] (too_many_arguments etc.). Without this,
# `cargo clippy --workspace -- -D warnings` on this package is stricter than
# the workspace-default clippy allows used in CI.
[lints]
workspace = true

[features]
default = [
    "jemalloc",
    "sandbox-enforce",
    "chutes-shell/default",
    "chutes-update/default",
]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    "test-support",
    "local-workspace",
    ]
local-workspace = ["chutes-shell/local-workspace"]
# No-op on this crate: the actual `#[global_allocator]` (and the
# `tikv-jemallocator` dep) live on the composition-root binary
# `chutes-build`, which owns `main.rs`. Kept as an empty feature so the
# workspace-uniform `[jemalloc, sandbox-enforce]` default set resolves
# here too and the generated `crate_features` stay valid.
jemalloc = []
sandbox-enforce = ["chutes-sandbox/enforce"]
release-dist = []
# Exposes test-only view-model constructors/setters (e.g. `test_agent_view`,
# `AgentSession::set_yolo_mode_for_test`) to sibling crates' test builds — used
# by `chutes-pager-minimal`'s unit tests. Never enabled in production builds.
test-support = ["chutes-pager-render/test-support", "chutes-gboom/test-support"]
